        const INITIAL_BUSINESSES = [
            {

                webUrl: "https://wa.me/51930528649?text=Hola,%20vi%20Frutas%20El%20Sol%20en%20MercadoPlaza",

            },
            {
                id: 2,

                image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=600&q=80",

            },
            {
                id: 3,
                name: "Pescadería Mar Azul",

                description: "Pescados y mariscos frescos del mar de Grau.",
                rating: 4.7,
                reviewsCount: 85,
                province: "Paita",
                district: "Paita",
                image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80",
                webUrl: "https://wa.me/51930528649?text=Hola,%20vi%20Pescaderia%20Mar%20Azul%20en%20MercadoPlaza",

                whatsapp: "51930528649"
            },
            {
                id: 4,
                name: "Panadería Delicias",
                category: "panaderias",
                categoryName: "Panaderías y dulcerías",
                description: "Panes y dulces artesanales recién horneados cada mañana.",
                rating: 4.6,
                reviewsCount: 110,
                province: "Sullana",
                district: "Sullana",
                image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80",

                whatsapp: "51930528649"
            },
            {
                id: 5,
                name: "Abarrotes Doña Lupita",
                category: "abarrotes",
                categoryName: "Abarrotes y alimentos",
                description: "Víveres al por mayor y menor con delivery local.",
                rating: 4.8,
                reviewsCount: 76,
                province: "Talara",
                district: "Pariñas",
                image: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=600&q=80",
                webUrl: "https://wa.me/51930528649?text=Hola,%20vi%20Abarrotes%20Dona%20Lupita%20en%20MercadoPlaza",
                mapUrl: "https://maps.google.com/?q=Talara,Peru",
                whatsapp: "51930528649"
            },
            {
                id: 6,
                name: "Carnes Finas Piura",
                category: "carnicerias",
                categoryName: "Carnicerías",
                description: "Cortes seleccionados de res, cerdo y pollo.",
                rating: 4.7,
                reviewsCount: 64,
                province: "Piura",
                district: "Piura",
                image: "https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?auto=format&fit=crop&w=600&q=80",
                webUrl: "https://wa.me/51930528649?text=Hola,%20vi%20Carnes%20Finas%20Piura",
                mapUrl: "https://maps.google.com/?q=Piura,Peru",
                whatsapp: "51930528649"
            }
        ];

        function App() {
            const [businesses, setBusinesses] = useState(() => {
                const saved = localStorage.getItem('mercadoplaza_businesses');
                return saved ? JSON.parse(saved) : INITIAL_BUSINESSES;
            });
            const [favorites, setFavorites] = useState(() => {
                const saved = localStorage.getItem('mercadoplaza_favorites');
                return saved ? JSON.parse(saved) : [1, 3];
            });

            const [searchQuery, setSearchQuery] = useState("");
            const [selectedProvince, setSelectedProvince] = useState("Piura");
            const [selectedDistrict, setSelectedDistrict] = useState("Piura");
            const [selectedCategory, setSelectedCategory] = useState("todos");

            // Modal States
            const [registerOpen, setRegisterOpen] = useState(false);
            const [ratingModalOpen, setRatingModalOpen] = useState(false);
            const [activeBusinessForRating, setActiveBusinessForRating] = useState(null);
            const [favoritesModalOpen, setFavoritesModalOpen] = useState(false);
            const [supportModalOpen, setSupportModalOpen] = useState(false);
            const [privacyModalOpen, setPrivacyModalOpen] = useState(false);
            const [termsModalOpen, setTermsModalOpen] = useState(false);
            const [toast, setToast] = useState(null);

            // Banner Carousel State
            const [currentBanner, setCurrentBanner] = useState(0);

            useEffect(() => {
                localStorage.setItem('mercadoplaza_businesses', JSON.stringify(businesses));
            }, [businesses]);

            useEffect(() => {
                localStorage.setItem('mercadoplaza_favorites', JSON.stringify(favorites));
            }, [favorites]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentBanner(prev => (prev + 1) % INITIAL_BANNERS.length);
                }, 5000);
                return () => clearInterval(timer);
            }, []);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3500);
            };

            const toggleFavorite = (id) => {
                setFavorites(prev => {
                    if (prev.includes(id)) {
                        showToast("Eliminado de mis favoritos");
                        return prev.filter(item => item !== id);
                    } else {
                        showToast("¡Agregado a mis favoritos!");
                        return [...prev, id];
                    }
                });
            };

            // Dynamic category counts
            const categoryCounts = useMemo(() => {
                const counts = {};
                OFFICIAL_CATEGORIES.forEach(cat => {
                    counts[cat.id] = businesses.filter(b => b.category === cat.id).length;
                });
                return counts;
            }, [businesses]);

            // Filtered businesses
            const filteredBusinesses = useMemo(() => {
                return businesses.filter(b => {
                    const matchesSearch = b.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          b.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          b.categoryName.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCategory = selectedCategory === "todos" || b.category === selectedCategory;
                    const matchesProvince = !selectedProvince || b.province === selectedProvince;
                    const matchesDistrict = !selectedDistrict || b.district === selectedDistrict;
                    return matchesSearch && matchesCategory && matchesProvince && matchesDistrict;
                });
            }, [businesses, searchQuery, selectedCategory, selectedProvince, selectedDistrict]);

            return (
                <div className="min-h-screen flex flex-col bg-white">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 bg-brandDark text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border-l-4 border-brandGreen animate-bounce">
                            <i data-lucide="check-circle" className="w-5 h-5 text-brandGreen"></i>
                            <span className="font-medium text-sm">{toast}</span>
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
                            {/* Logo */}
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setSelectedCategory("todos"); setSearchQuery(""); }}>
                                <div className="w-11 h-11 bg-brandOrange rounded-xl flex items-center justify-center shadow-md">
                                    <i data-lucide="store" className="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <div className="text-2xl font-black tracking-tight flex items-center">
                                        <span className="text-brandBlue">Mercado</span>
                                        <span className="text-brandGreen">Plaza</span>
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium hidden sm:block">Tu mercado en un solo lugar</p>
                                </div>
                            </div>

                            {/* Search Bar & Location (Desktop) */}
                            <div className="hidden md:flex items-center flex-1 max-w-2xl bg-slate-100 rounded-full px-4 py-2 border border-slate-200 focus-within:ring-2 focus-within:ring-brandBlue/30">
                                <i data-lucide="search" className="w-5 h-5 text-slate-400 mr-2"></i>
                                <input 
                                    type="text" 
                                    placeholder="Buscar puestos, productos o rubros..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="bg-transparent border-none outline-none w-full text-sm text-slate-800 placeholder-slate-400"
                                />
                                <div className="h-5 w-[1px] bg-slate-300 mx-3"></div>
                                <div className="flex items-center text-sm text-slate-700 font-medium whitespace-nowrap">
                                    <i data-lucide="map-pin" className="w-4 h-4 text-brandRed mr-1.5"></i>
                                    <select 
                                        value={selectedProvince}
                                        onChange={(e) => {
                                            setSelectedProvince(e.target.value);
                                            setSelectedDistrict(PIURA_LOCATIONS[e.target.value][0]);
                                        }}
                                        className="bg-transparent border-none outline-none cursor-pointer font-semibold text-brandBlue"
                                    >
                                        {Object.keys(PIURA_LOCATIONS).map(prov => (
                                            <option key={prov} value={prov}>{prov}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Right Actions */}
                            <div className="flex items-center space-x-3">
                                {/* Favorites Button */}
                                <button 
                                    onClick={() => setFavoritesModalOpen(true)}
                                    className="relative p-2.5 rounded-full hover:bg-slate-100 text-slate-700 transition"
                                    title="Mis Favoritos"
                                >
                                    <i data-lucide="heart" className="w-6 h-6 text-brandRed fill-brandRed"></i>
                                    {favorites.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-brandRed text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">
                                            {favorites.length}
                                        </span>
                                    )}
                                </button>

                                {/* Register Button */}
                                <button 
                                    onClick={() => setRegisterOpen(true)}
                                    className="bg-brandGreen hover:bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow-lg shadow-emerald-500/20 flex items-center space-x-2 transition transform active:scale-95"
                                >
                                    <i data-lucide="store" className="w-4 h-4"></i>
                                    <span className="hidden sm:inline">Registrar Puesto</span>
                                    <span className="sm:hidden">Registrar</span>
                                </button>
                            </div>
                        </div>

                        {/* Mobile Search & Location Bar */}

                                <i data-lucide="search" className="w-4 h-4 text-slate-400 mr-2"></i>
                                <input 
                                    type="text" 
                                    placeholder="Buscar en MercadoPlaza..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}

                                />
                            </div>
                            <select 
                                value={selectedProvince}
                                onChange={(e) => {
                                    setSelectedProvince(e.target.value);
                                    setSelectedDistrict(PIURA_LOCATIONS[e.target.value][0]);
                                }}
                                className="bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold text-brandBlue outline-none"
                            >
                                {Object.keys(PIURA_LOCATIONS).map(prov => (
                                    <option key={prov} value={prov}>{prov}</option>
                                ))}
                            </select>
                        </div>

                    {/* MAIN CONTENT CONTAINER */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-12">
                        
                        {/* BANNERS CAROUSEL */}
                        <section className="relative overflow-hidden rounded-3xl shadow-lg bg-slate-900 group">
                            <div className="relative h-56 sm:h-80 md:h-96 w-full">
                                {INITIAL_BANNERS.map((banner, index) => (
                                    <div 
                                        key={banner.id}
                                        className={`absolute inset-0 transition-opacity duration-700 ease-in-out ${index === currentBanner ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}
                                    >
                                        <img src={banner.image} alt={banner.title} className="w-full h-full object-cover brightness-75" />
                                        <div className="absolute inset-0 bg-gradient-to-r from-slate-950/80 via-slate-950/40 to-transparent flex items-center p-6 sm:p-12">
                                            <div className="max-w-xl text-white space-y-3">
                                                <span className="bg-brandOrange text-white text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full">Destacado</span>
                                                <h2 className="text-2xl sm:text-4xl font-extrabold leading-tight">{banner.title}</h2>
                                                <p className="text-sm sm:text-lg text-slate-200 font-medium">{banner.subtitle}</p>
                                                <a 
                                                    href={banner.link} 
                                                    onClick={(e) => {
                                                        if(banner.link === '#registrar') {
                                                            e.preventDefault();
                                                            setRegisterOpen(true);
                                                        }
                                                    }}
                                                    className="inline-flex items-center space-x-2 bg-brandGreen hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md transition"
                                                >
                                                    <span>Explorar ahora</span>
                                                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Carousel Controls */}
                            <button 
                                onClick={() => setCurrentBanner(prev => (prev - 1 + INITIAL_BANNERS.length) % INITIAL_BANNERS.length)}
                                className="absolute left-4 top-1/2 -translate-y-1/2 z-20 bg-black/40 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-sm transition"
                            >
                                <i data-lucide="chevron-left" className="w-6 h-6"></i>
                            </button>
                            <button 
                                onClick={() => setCurrentBanner(prev => (prev + 1) % INITIAL_BANNERS.length)}
                                className="absolute right-4 top-1/2 -translate-y-1/2 z-20 bg-black/40 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-sm transition"
                            >
                                <i data-lucide="chevron-right" className="w-6 h-6"></i>
                            </button>

                            {/* Indicators */}
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex space-x-2">
                                {INITIAL_BANNERS.map((_, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => setCurrentBanner(idx)}
                                        className={`w-3 h-3 rounded-full transition-all ${idx === currentBanner ? 'bg-brandGreen w-8' : 'bg-white/50'}`}
                                    ></button>
                                ))}
                            </div>
                        </section>

                        {/* EXPLORE CATEGORIES */}
                        <section className="space-y-6">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-brandBlue">
                                        <i data-lucide="star" className="w-5 h-5 fill-brandBlue"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-slate-900">Explora nuestros rubros</h2>
                                </div>
                                <button 
                                    onClick={() => setSelectedCategory("todos")}
                                    className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${selectedCategory === 'todos' ? 'bg-brandBlue text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                >
                                    Todos los rubros
                                </button>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                                {OFFICIAL_CATEGORIES.map(cat => {
                                    const count = categoryCounts[cat.id] || 0;
                                    const isSelected = selectedCategory === cat.id;
                                    return (
                                        <div 
                                            key={cat.id}
                                            onClick={() => setSelectedCategory(isSelected ? "todos" : cat.id)}
                                            className={`cursor-pointer bg-slate-50 hover:bg-blue-50/50 border rounded-2xl p-4 flex flex-col items-center text-center transition-all duration-200 group ${isSelected ? 'border-brandBlue bg-blue-50 ring-2 ring-brandBlue/20 shadow-md' : 'border-slate-200 hover:border-brandBlue/40'}`}
                                        >
                                            <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mb-3 transition group-of-hover:scale-110 ${isSelected ? 'bg-brandBlue text-white' : 'bg-white text-brandBlue shadow-sm'}`}>

                                        value={province} 
                                        onChange={handleProvinceChange}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none font-semibold text-brandBlue"
                                    >
                                        {Object.keys(PIURA_LOCATIONS).map(prov => (
                                            <option key={prov} value={prov}>{prov}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Distrito *</label>
                                    <select 
                                        value={district} 
                                        onChange={(e) => setDistrict(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none font-semibold text-brandBlue"
                                    >
                                        {PIURA_LOCATIONS[province].map(dist => (
                                            <option key={dist} value={dist}>{dist}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Dirección o referencia *</label>
                                <input 
                                    type="text" 
                                    required 
                                    placeholder="Ej: Mercado Central, Sector A, Puesto 45" 
                                    value={address}
                                    onChange={(e) => setAddress(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none"
                                />
                            </div>

                            <div className="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div>
                                    <p className="text-xs font-bold text-slate-800">Ubicación GPS (Opcional)</p>
                                    <p className="text-[11px] text-slate-500">{coords ? `Lat: ${coords.lat.toFixed(4)}, Lng: ${coords.lng.toFixed(4)}` : "Facilita la llegada de tus clientes"}</p>
                                </div>
                                <button 
                                    type="button" 
                                    onClick={detectGps}
                                    className="bg-brandBlue text-white text-xs font-bold px-4 py-2 rounded-lg shadow"
                                >
                                    {loadingGps ? "Detectando..." : "Detectar mi GPS"}
                                </button>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Catálogo virtual o Facebook (Opcional)</label>
                                <input 
                                    type="url" 
                                    placeholder="https://facebook.com/tupuesto o enlace de catálogo" 
                                    value={webUrl}
                                    onChange={(e) => setWebUrl(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none"
                                />
                            </div>

                            <div className="flex items-start space-x-3 pt-2">
                                <input 
                                    type="checkbox" 
                                    id="privacy" 
                                    checked={acceptedPrivacy}
                                    onChange={(e) => setAcceptedPrivacy(e.target.checked)}
                                    className="mt-1 w-4 h-4 text-brandGreen rounded border-slate-300 focus:ring-brandGreen"
                                />
                                <label htmlFor="privacy" className="text-xs text-slate-600">
                                    Acepto la <span className="font-bold text-brandBlue">política de privacidad</span> y el tratamiento de mis datos para fines comerciales y del directorio MercadoPlaza.
                                </label>
                            </div>

                            <div className="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    className="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition"
                                >
                                    Cancelar
                                </button>
                                <button 
                                    type="submit" 
                                    className="bg-brandGreen hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 text-sm transition"
                                >
                                    Completar Registro Gratuito
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // RATING MODAL (OTP Simulation)
        function RatingModal({ business, onClose, onSuccess }) {
            const [step, setStep] = useState(1); // 1: input phone, 2: input OTP & rating
            const [phone, setPhone] = useState("");
            const [otpCode, setOtpCode] = useState("");
            const [stars, setStars] = useState(5);
            const [comment, setComment] = useState("");
            const [loading, setLoading] = useState(false);

            const requestOtp = (e) => {
                e.preventDefault();
                if (!phone || phone.length < 9) {
                    alert("Ingrese un número de WhatsApp válido.");
                    return;
                }
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setStep(2);
                    alert("¡Código OTP enviado a su WhatsApp! (Código de prueba: 5432)");
                }, 1000);
            };

            const submitRating = (e) => {
                e.preventDefault();
                if (otpCode !== "5432") {
                    alert("Código OTP incorrecto. Ingrese '5432' como código de prueba.");
                    return;
                }

                // Recalculate rating
                const newReviewsCount = business.reviewsCount + 1;
                const newRating = Number(((business.rating * business.reviewsCount + stars) / newReviewsCount).toFixed(1));

                const updated = {
                    ...business,
                    rating: newRating,
                    reviewsCount: newReviewsCount
                };

                onSuccess(updated);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                            <div>
                                <h3 className="text-lg font-bold text-slate-900">Calificar Puesto</h3>
                                <p className="text-xs text-brandBlue font-semibold">{business.name}</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        {step === 1 ? (
                            <form onSubmit={requestOtp} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Número de WhatsApp (Verificación OTP)</label>
                                    <input 
                                        type="tel" 
                                        required 
                                        placeholder="Ej: 930528649" 
                                        value={phone}
                                        onChange={(e) => setPhone(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none"
                                    />
                                    <p className="text-[11px] text-slate-500 mt-1">Enviaremos un código de verificación para evitar votos duplicados.</p>
                                </div>
                                <button 
                                    type="submit" 
                                    className="w-full bg-brandBlue text-white font-bold py-3 rounded-xl shadow text-sm hover:bg-blue-700 transition"
                                >
                                    {loading ? "Enviando código..." : "Solicitar código de verificación"}
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={submitRating} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Ingrese código OTP recibido</label>
                                    <input 
                                        type="text" 
                                        required 
                                        placeholder="Ej: 5432" 
                                        value={otpCode}
                                        onChange={(e) => setOtpCode(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none tracking-widest text-center font-bold text-lg"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Seleccione estrellas (1 a 5)</label>
                                    <div className="flex items-center justify-center space-x-2 py-2">
                                        {[1, 2, 3, 4, 5].map((num) => (
                                            <button 
                                                type="button" 
                                                key={num}
                                                onClick={() => setStars(num)}
                                                className="p-1 focus:outline-none"
                                            >
                                                <i data-lucide="star" className={`w-8 h-8 ${num <= stars ? 'text-brandYellow fill-brandYellow' : 'text-slate-300'}`}></i>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Comentario o sugerencia (Opcional)</label>
                                    <textarea 
                                        rows="2"
                                        placeholder="Excelente atención y productos muy frescos..."
                                        value={comment}
                                        onChange={(e) => setComment(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none"
                                    ></textarea>
                                </div>

                                <button 
                                    type="submit" 
                                    className="w-full bg-brandGreen text-white font-bold py-3 rounded-xl shadow text-sm hover:bg-emerald-600 transition"
                                >
                                    Enviar Calificación Verificada
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        // FAVORITES MODAL
        function FavoritesModal({ favorites, businesses, onClose, onToggleFav }) {
            const favList = businesses.filter(b => favorites.includes(b.id));

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl max-h-[80vh] flex flex-col">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                            <div className="flex items-center space-x-2">
                                <i data-lucide="heart" className="w-6 h-6 text-brandRed fill-brandRed"></i>
                                <h3 className="text-xl font-bold text-slate-900">Mis Favoritos</h3>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                            {favList.length === 0 ? (
                                <div className="text-center py-12 space-y-3">
                                    <div className="w-16 h-16 bg-red-50 text-brandRed rounded-full flex items-center justify-center mx-auto">
                                        <i data-lucide="heart" className="w-8 h-8"></i>
                                    </div>
                                    <p className="text-sm font-bold text-slate-800">Aún no tienes puestos favoritos</p>
                                    <p className="text-xs text-slate-500">Haz clic en el corazón rojo de cualquier puesto para guardarlo aquí.</p>
                                </div>
                            ) : (
                                favList.map(bus => (
                                    <div key={bus.id} className="flex items-center justify-between bg-slate-50 border border-slate-200 p-3 rounded-2xl">
                                        <div className="flex items-center space-x-3">
                                            <img src={bus.image} alt={bus.name} className="w-14 h-14 rounded-xl object-cover" />
                                            <div>
                                                <span className="text-[10px] font-bold text-brandBlue uppercase">{bus.categoryName}</span>
                                                <h4 className="font-bold text-sm text-slate-900">{bus.name}</h4>
                                                <p className="text-xs text-slate-500">{bus.province} - {bus.district}</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => onToggleFav(bus.id)}
                                            className="p-2 hover:bg-red-100 text-brandRed rounded-xl transition"
                                            title="Quitar de favoritos"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // SUPPORT MODAL
        function SupportModal({ onClose }) {
            const [name, setName] = useState("");
            const [amount, setAmount] = useState("20");
            const [method, setMethod] = useState("Yape");
            const [note, setNote] = useState("");

            const handleSupport = (e) => {
                e.preventDefault();
                const msg = `Hola,%20deseo%20apoyar%20a%20MercadoPlaza.%0A*Nombre:*%20${encodeURIComponent(name || 'Anónimo')}%0A*Medio:*%20${method}%0A*Monto:*%20S/%20${amount}%0A*Nota:*%20${encodeURIComponent(note || 'Sin nota')}`;
                window.open(`https://wa.me/51930528649?text=${msg}`, '_blank');
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                            <div>
                                <h3 className="text-xl font-bold text-slate-900">Apoya a MercadoPlaza</h3>
                                <p className="text-xs text-slate-500">Tu aporte voluntario nos ayuda a mantener vivo el comercio local</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSupport} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Nombres y Apellidos (Opcional)</label>
                                <input 
                                    type="text" 
                                    placeholder="Ej: Juan Pérez" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Medio de aporte</label>
                                    <select 
                                        value={method}
                                        onChange={(e) => setMethod(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none font-semibold text-brandOrange"
                                    >
                                        <option value="Yape">Yape</option>
                                        <option value="Plin">Plin</option>
                                        <option value="Transferencia">Transferencia</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Importe (S/)</label>
                                    <input 
                                        type="number" 
                                        min="5" 
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none font-bold"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Nota opcional</label>
                                <textarea 
                                    rows="2"
                                    placeholder="¡Excelente iniciativa para los mercados de Piura!"
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none"
                                ></textarea>
                            </div>

                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[11px] text-amber-800">
                                <p className="font-bold mb-0.5">Nota importante:</p>
                                <p>Esta es una intención de aporte voluntario. Al enviar, se abrirá WhatsApp con el resumen para coordinar directamente.</p>
                            </div>

                            <button 
                                type="submit" 
                                className="w-full bg-brandOrange hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-500/20 text-sm transition flex items-center justify-center space-x-2"
                            >
                                <i data-lucide="message-circle" className="w-5 h-5"></i>
                                <span>Enviar intención de aporte</span>
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // GENERIC INFO MODAL
        function InfoModal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl max-h-[80vh] flex flex-col">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                            <h3 className="text-xl font-bold text-slate-900">{title}</h3>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto text-sm text-slate-600 leading-relaxed pr-1">
                            {children}
                        </div>
                        <div className="pt-4 border-t border-slate-100 text-right">
                            <button 
                                onClick={onClose} 
                                className="bg-brandBlue text-white px-6 py-2.5 rounded-xl font-semibold text-sm shadow"
                            >
                                Entendido
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons after render
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);
    </script>
</body>
</html>
